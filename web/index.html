<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>첫집 내비 프로토타입</title>
<style>
:root{
  --ink:#191f28; --sub:#6b7684; --mute:#9aa3ad; --line:#e8ebee; --bg:#f7f8fa; --white:#fff;
  --pri:#2f6bff; --pri-d:#1f55d9; --pri-s:#eef3ff;
  --warn:#e8590c; --warn-s:#fff4e6;
  /* 보조색: 보라(AI) · 초록(좋음·지금 가능) · 주황(주의·마감) — 집 A/B/C도 이 세 색 */
  --purple:#7048e8; --purple-s:#f3efff; --green:#0ca678; --green-t:#099268; --green-s:#e6f8f1; --orange:#f76707; --orange-s:#fff4e6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans KR","Noto Sans CJK KR",-apple-system,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{min-height:100vh;background:var(--white);display:flex;flex-direction:column}

/* header */
.top{height:64px;display:flex;align-items:center;gap:32px;padding:0 32px;border-bottom:1px solid var(--line);background:var(--white);position:sticky;top:0;z-index:5}
.logo{font-weight:800;font-size:19px;letter-spacing:-.3px}
.logo b{color:var(--pri)}
.tabs{display:flex;gap:4px}
.tab{font-size:15px;color:var(--mute);padding:8px 12px;border-radius:8px}
.tab:hover{background:var(--bg)}
.tab.on{color:var(--ink);font-weight:700}
.tab i{font-style:normal;display:inline-flex;width:20px;height:20px;border-radius:10px;background:var(--line);color:var(--sub);font-size:12px;align-items:center;justify-content:center;margin-right:6px}
.tab.on i{background:var(--pri);color:#fff}
.tab.done i{background:var(--pri-s);color:var(--pri)}
.toggle{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--sub)}
.sw{width:46px;height:26px;border-radius:13px;background:#d5dae0;position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.sw.on{background:var(--pri)}
.sw.on::after{left:23px}

/* layout */
.main{flex:1;display:flex;justify-content:center;padding:48px 32px 120px}
.col{width:680px;display:flex;flex-direction:column}
.eyebrow{font-size:14px;font-weight:700;color:var(--pri);margin-bottom:8px}
h1{font-size:28px;line-height:1.4;letter-spacing:-.5px;font-weight:800}
.lead{font-size:16px;color:var(--sub);line-height:1.6;margin-top:8px}
.sec{margin-top:40px}
.sec-t{font-size:17px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sec-t small{font-size:13px;font-weight:500;color:var(--mute)}
.p{font-size:16px;line-height:1.7}
.s{font-size:14px;color:var(--sub);line-height:1.6}
.hr{height:1px;background:var(--line);margin:28px 0}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--pri-s);color:var(--pri)}
.pill.warn{background:var(--warn-s);color:var(--warn)}
.pill.gray{background:var(--bg);color:var(--sub)}

/* buttons */
.btn{white-space:nowrap;flex-shrink:0;height:52px;border-radius:12px;font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 22px}
.btn.pri{background:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.ghost{background:var(--bg);color:var(--ink)}
.btn.wide{width:100%}
.chip{height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--line);font-size:15px;color:var(--ink);background:#fff}
.chip.on{border-color:var(--pri);background:var(--pri-s);color:var(--pri);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.link{color:var(--pri);font-weight:600;font-size:14px;text-align:left}
.back{align-self:flex-start}
.cta .btn.wide{width:auto;flex:1}
.cta{position:sticky;bottom:0;background:linear-gradient(transparent,#fff 30%);padding:24px 0 28px;margin-top:40px;display:flex;gap:10px}

/* chat */
.chat{display:flex;flex-direction:column;gap:14px;margin-top:28px}
.bub{max-width:82%;font-size:16px;line-height:1.65;padding:14px 18px;border-radius:18px}
.bub.me{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:6px}
.bub.ai{align-self:flex-start;background:var(--bg);border-bottom-left-radius:6px}
.who{font-size:13px;color:var(--mute);margin:4px 0 -8px}
.prof{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.prof button{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--sub);transition:border-color .15s}
.prof button:hover{border-color:var(--pri)}
.prof .pi{width:28px;height:28px;border-radius:8px;background:var(--pri-s);color:var(--pri);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prof .pi svg{width:16px;height:16px}
.prof b{display:block;font-size:15px;color:var(--ink);margin-top:1px}
.bub.me mark{background:rgba(255,255,255,.22);color:#fff;border-radius:4px;padding:0 3px;border-bottom:2px solid rgba(255,255,255,.8)}
.found{font-size:12.5px;color:var(--sub);align-self:flex-end;margin-top:-6px}
.found b{color:var(--pri)}
.qcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px}
.qcard .qn{display:inline-flex;width:22px;height:22px;border-radius:11px;background:var(--pri);color:#fff;font-size:12px;font-weight:800;align-items:center;justify-content:center;margin-right:8px}
.qcard.ok .qn{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
.qcard .chips{margin-top:10px}
.qcard .chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.prog{height:8px;border-radius:4px;background:#f1f3f5;margin:4px 0 14px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--pri);border-radius:4px;transition:width .3s}
.ex{display:block;width:100%;text-align:left;font-size:13.5px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-top:8px}
.ex:hover{border-color:var(--pri)}
.compose{margin-top:24px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:28px;padding:6px 6px 6px 20px}
.compose input{flex:1;border:0;outline:0;font:inherit;font-size:15px}
.send{width:40px;height:40px;border-radius:20px;background:var(--pri);color:#fff;font-weight:700}

/* list rows (instead of boxes) */
.list{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:16px;padding:18px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:hover{background:#fbfcfd}
.radio{width:22px;height:22px;border-radius:11px;border:2px solid #cfd5dc;flex-shrink:0;position:relative}
.radio.on{border-color:var(--pri)}
.radio.on::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--pri)}
.check{width:22px;height:22px;border-radius:6px;border:2px solid #cfd5dc;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.check.on{background:var(--pri);border-color:var(--pri)}
.row .name{font-size:16px;font-weight:700}
.row .meta{font-size:14px;color:var(--sub);margin-top:3px}
.row .right{margin-left:auto;text-align:right}
.row .amt{font-size:17px;font-weight:800}
.row .amt.pri{color:var(--pri)}
.chev{color:var(--mute);font-size:14px;margin-left:8px;transition:.2s}
.chev.open{transform:rotate(90deg)}
.detail{padding:4px 4px 22px 98px;border-bottom:1px solid var(--line)}

/* evidence */
.ev{display:grid;grid-template-columns:150px 18px 1fr;gap:10px 8px;align-items:center;font-size:15px;margin-top:10px}
.ev .k{color:var(--sub)}
.ev .ar{color:var(--mute)}
.ev .v.ok::before{content:"✓ ";color:var(--pri);font-weight:800}
.ev .v.q{color:var(--warn)}
.ev .v.q::before{content:"? ";font-weight:800}
.quote{margin-top:14px;font-size:14px;line-height:1.7;color:var(--sub);padding-left:14px;border-left:3px solid var(--pri)}
.quote mark{background:#e3ebff;color:var(--ink);padding:0 2px}

/* summary strip */
.strip{display:flex;gap:32px;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.strip div{font-size:13px;color:var(--sub)}
.strip b{display:block;font-size:24px;color:var(--ink);margin-top:4px;letter-spacing:-.4px}
.strip b.pri{color:var(--pri)}

/* note */
.note{display:flex;gap:10px;font-size:15px;line-height:1.65;padding:14px 16px;border-radius:12px;background:var(--bg)}
.note.warn{background:var(--warn-s)}
.note .ic{font-weight:800;color:var(--pri)}
.note.warn .ic{color:var(--warn)}

/* table */
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--sub);font-weight:600;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:15px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.best{background:none}
td.best b{color:#2f6bff}
td .v{font-size:17px;font-weight:700;color:var(--ink)}
td .w{display:block;font-size:12.5px;color:var(--sub);margin-top:2px;font-weight:400}
.htag{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--ink)}
.htag i{font-style:normal;width:22px;height:22px;border-radius:11px;color:#fff;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.sumcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sumcard{border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;border-top-width:5px}
.sumcard .k{font-size:13px;color:var(--sub);margin-top:10px}
.sumcard .n{font-size:22px;font-weight:800;letter-spacing:-.3px}
.sumcard .n small{font-size:14px;font-weight:600;color:var(--sub);margin-left:2px}
.sumcard .top1{font-size:12px;font-weight:800;color:#2f6bff;background:#eef3ff;border-radius:999px;padding:2px 8px;margin-left:6px}
@media (max-width:760px){.sumcards{grid-template-columns:1fr}}
tr.clk{cursor:pointer}
tr.clk:hover td{background:#fbfcfd}

/* diff */
.diff{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:16px}
.diff h4{font-size:14px;margin-bottom:6px}
.plus h4{color:var(--pri)} .minus h4{color:var(--warn)}

/* map */
.map{border-radius:14px;overflow:hidden;background:#f1f3f6}

/* modal sheet */
.dim{position:fixed;inset:0;background:rgba(25,31,40,.35);display:flex;align-items:center;justify-content:center;z-index:20}
.sheet{width:720px;background:#fff;border-radius:20px;padding:32px;max-height:88vh;overflow:auto}
.sheet-h{display:flex;align-items:center;margin-bottom:18px}
.x{margin-left:auto;font-size:22px;color:var(--sub)}

/* ===== 1단계 한 화면 선택형 입력 (2026-11-17 · 시안 step1_page.html) ===== */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.f1h{display:flex;align-items:flex-end;margin-bottom:20px}
.f1h h1{font-size:30px}
.f1ex{margin-left:auto;font-size:13px;font-weight:700;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:#fff}
.f1ex:hover{border-color:var(--pri);color:var(--pri)}
.f1ai{border:1.5px solid #d9cffc;background:#fbf9ff;border-radius:16px;padding:16px 18px;margin-bottom:20px}
.f1ai .t{display:block;font-size:15px;font-weight:800;color:var(--purple)}
.f1ai .f1airow{display:flex;gap:10px;margin-top:10px}
.f1ai textarea{flex:1;background:#fff;border:1.5px solid #d9cffc;border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;line-height:1.5;resize:vertical;outline:0}
.f1ai textarea:focus{border-color:var(--purple)}
.f1ai .go{background:var(--purple);color:#fff;border-radius:12px;padding:0 18px;font-size:15px;font-weight:700;white-space:nowrap}
.f1ai .go[disabled]{opacity:.45;cursor:default}
.f1card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:4px 22px}
.f1{display:flex;gap:20px;padding:18px 0;border-bottom:1px solid var(--line);align-items:flex-start;scroll-margin:120px;transition:background .3s}
.f1:last-child{border-bottom:0}
.f1.hl{background:var(--orange-s);margin:0 -22px;padding:18px 22px;border-radius:12px}
.f1 .lab{width:160px;flex-shrink:0;padding-top:9px}
.f1 .lab b{display:block;font-size:16px;font-weight:700}.f1 .lab small{display:block;font-size:12.5px;color:var(--sub);margin-top:3px}
.f1 .ctl{flex:1;min-width:0}
.f1 .chips{align-items:center}
.f1 .chip{height:auto;line-height:1.3;border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;font-size:15px;font-weight:600;color:#4e5968}
.f1 .chip.sm{padding:7px 13px;font-size:14px}
.f1 .chip.on{border-color:var(--pri);background:var(--pri-s);color:var(--pri)}
.f1 .mt{margin-top:10px}
.f1line{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.f1sel{width:180px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:18px;font-weight:800;background:#fff;color:var(--ink)}
.f1sel:focus{border-color:var(--pri);outline:0}
.f1age{font-size:15px;color:var(--sub)}.f1age b{color:var(--ink);font-size:16px}
.f1bd{font-size:14px;font-weight:700;color:#a8460a}
.f1pick,.f1search{display:flex;align-items:center;gap:10px;border:1.5px solid var(--pri);border-radius:12px;padding:10px 14px}
.f1pick .q{flex:1}.f1pick .q b{display:block;font-size:16px}.f1pick .q small{font-size:13px;color:var(--sub)}
.f1search input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:16px;font-weight:600}
.f1pl small{display:block;font-size:11.5px;color:var(--mute);font-weight:400}
.f1num{display:inline-flex;align-items:baseline;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;min-width:180px;background:#fff}
.f1num:focus-within{border-color:var(--pri)}
.f1num input{width:110px;flex:1;border:0;outline:0;font:inherit;font-size:20px;font-weight:800;min-width:0}
.f1num span:not(.sr){font-size:14px;color:var(--sub);font-weight:600;white-space:nowrap}
.f1tog{display:inline-flex;background:#f2f4f6;border-radius:10px;padding:3px}
.f1tog button{padding:7px 14px;font-size:14px;font-weight:700;color:var(--sub);border-radius:8px}.f1tog button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.f1conv{font-size:14px;color:var(--sub)}.f1conv b{color:var(--ink)}
.f1ok{display:inline-block;margin-top:10px;background:var(--green-s);color:#0b7a5a;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:700}
.f1ok.over{background:var(--orange-s);color:#a8460a}
.f1over{margin-top:8px;font-size:13px;color:var(--warn)}
.f1cnt{margin-left:auto;font-size:13px;color:var(--pri);font-weight:700}
.f1panel .prog{height:6px;margin:0 0 6px}
.f1kv{width:100%;text-align:left;border-bottom:1px solid #f1f3f5}
.f1kv:hover span{color:var(--pri)}
.f1kv b.nil{color:#c4cad1;font-weight:400}
.f1note{font-size:13px;color:#a8460a;background:var(--orange-s);border-radius:12px;padding:12px 14px}
.btn.off{opacity:.45}
#p1side{display:contents}
.f1card button:focus-visible,.f1panel button:focus-visible,#f1go:focus-visible,.f1ex:focus-visible,.f1card select:focus-visible{outline:3px solid #9db8ff;outline-offset:2px}

/* ===== EASY MODE ===== */
.easy .col{width:720px}
.easy h1{font-size:38px;line-height:1.35}
.easy .lead{font-size:22px;color:var(--ink)}
.easy .eyebrow{font-size:18px}
.easy .p,.easy .bub{font-size:22px}
.easy .s{font-size:19px;color:#4e5968}
.easy .btn{height:76px;font-size:24px;border-radius:16px}
.easy .tab{font-size:17px}
.easy .toggle{font-size:18px;color:var(--ink)}
.easy .sw{width:58px;height:32px;border-radius:16px}
.easy .sw::after{width:26px;height:26px;border-radius:13px}
.easy .sw.on::after{left:29px}
.big-q{display:flex;flex-direction:column;gap:14px;margin-top:36px}
.erow{display:flex;align-items:center;gap:20px;padding:26px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.erow .n{width:48px;height:48px;border-radius:24px;background:var(--pri-s);color:var(--pri);font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.erow .n.warn{background:var(--warn-s);color:var(--warn)}
.erow .t{font-size:24px;font-weight:800}
.erow .d{font-size:19px;color:#4e5968;margin-top:4px;line-height:1.5}
.erow .m{margin-left:auto;font-size:24px;font-weight:800;color:var(--pri);white-space:nowrap}
.hero-num{font-size:56px;font-weight:800;letter-spacing:-1px;color:var(--pri);margin:8px 0}

/* icons & map extras */
.ico{width:40px;height:40px;border-radius:12px;background:var(--pri-s);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ico svg{width:22px;height:22px}
.ico.sm{width:30px;height:30px;border-radius:9px}.ico.sm svg{width:17px;height:17px}
.ico.lg{width:56px;height:56px;border-radius:16px}.ico.lg svg{width:30px;height:30px}
.ico.warn{background:var(--warn-s);color:var(--warn)}
.ico.gray{background:var(--bg);color:var(--sub)}
.pin{width:30px;height:30px;border-radius:15px;color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.pin.a{background:#191f28}.pin.b{background:var(--pri)}
.legend{display:flex;gap:22px;align-items:center;font-size:14px;color:var(--sub);margin:14px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:6px}
.legend span{display:inline-flex;align-items:center;gap:4px}

.slots{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.slot{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:1.5px dashed #d5dae0}
.slot.now{border-color:var(--pri);background:var(--pri-s)}
.slot.full{border:1px solid var(--line)}
.slot .name{font-size:16px;font-weight:700}.slot .meta{font-size:13px;color:var(--sub);margin-top:2px}
.pin.empty{background:#fff;border:1.5px dashed #b8c0ca;color:var(--mute)}
.segs{display:inline-flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg{height:38px;padding:0 18px;border-radius:9px;font-size:15px;color:var(--sub);font-weight:600}
.seg.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(25,31,40,.1)}
textarea.paste{margin-top:16px;width:100%;height:150px;border:1px solid var(--line);border-radius:14px;padding:16px 18px;font:inherit;font-size:15px;line-height:1.7;resize:none;outline:0;color:var(--ink)}
textarea.paste:focus{border-color:var(--pri)}

.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fields label{font-size:13px;color:var(--sub);display:flex;flex-direction:column;gap:6px}
.inp{display:flex;align-items:center;gap:6px;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:15px;color:var(--sub)}
.inp input{flex:1;min-width:0;width:100%;border:0;outline:0;font:inherit;font-size:16px;font-weight:700;color:var(--ink)}
.inp input::placeholder{font-weight:400;font-size:13px;color:var(--mute)}
.compose .ico{margin-left:-8px}

.verdict{margin-top:44px;border-top:2px solid var(--ink);padding-top:22px}
.vhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.vhead .nm{font-size:26px;font-weight:800;letter-spacing:-.4px}
.vhead .sc{margin-left:auto;font-size:15px;color:var(--sub)}
.vhead .sc b{font-size:26px;color:var(--ink);margin-right:2px}
.rk{display:grid;grid-template-columns:28px 120px 1fr 64px;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.rk .no{font-weight:800;color:var(--sub)}
.rk .bar{height:10px;border-radius:5px;background:#f1f3f5;overflow:hidden}
.rk .bar span{display:block;height:100%;border-radius:5px}
.rk .t{text-align:right;font-weight:700}
.rk .d{grid-column:3/5;font-size:12.5px;color:var(--sub);margin-top:-6px}
.why-list{margin:8px 0 0;padding-left:18px;font-size:15px;line-height:1.75}
.maplink{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--pri);background:var(--pri-s);border-radius:999px;padding:6px 12px;margin-top:14px}
.maplink:hover{background:#e3ebff}
td .go{float:right;font-size:12px;font-weight:700;color:var(--pri);opacity:.0;transition:opacity .15s}
tr.clk:hover td .go,tr.clk td .go.show{opacity:1}
tr.clk:hover td{background:#f5f8ff}
.hchip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px 7px 8px;font-size:15px;font-weight:600;background:#fff}
.hchip i{font-style:normal;width:22px;height:22px;border-radius:11px;color:#fff;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.vt{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:800;letter-spacing:-.4px;margin:8px 0 18px}
.vrows{display:flex;flex-direction:column;gap:2px;background:#fff;border-radius:14px;padding:6px 16px}
.vr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.vr:last-child{border-bottom:0}
.vk{width:130px;font-size:15px;font-weight:700}
.vv{flex:1;font-size:15px;color:var(--sub)}

.cal{border:1px solid var(--line);border-radius:16px;padding:18px 18px 10px}
.cal-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-h b{font-size:17px}
.cal-h .nav{width:30px;height:30px;border-radius:8px;background:var(--bg);font-size:16px;color:var(--sub)}
.cal-lg{margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--sub)}
.cal-lg span{display:inline-flex;align-items:center;gap:5px}
.cal-lg i{width:14px;height:8px;border-radius:3px;display:inline-block}
.cal-lg i.warn{background:var(--warn-s);border:1px solid #ffc078}.cal-lg i.pri{background:var(--pri-s);border:1px solid #b9cbff}.cal-lg i.line{border:1.5px solid var(--pri);background:#fff}
.dow{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;color:var(--mute);text-align:left;padding:0 6px 6px}
.wk{border-top:1px solid var(--line);min-height:76px;padding-bottom:6px}
.days{display:grid;grid-template-columns:repeat(7,1fr)}
.dn{font-size:13px;color:var(--ink);padding:6px 6px 4px}
.dn.sun{color:#d64545}.dn.out{color:#cfd5dc}
.dn.today span{background:var(--pri);color:#fff;border-radius:11px;padding:2px 6px;font-weight:700}
.bars{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:24px;row-gap:3px;padding:0 2px}
.bar{font-size:12px;font-weight:700;text-align:left;padding:0 8px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 2px}
.bar.warn{background:var(--warn-s);color:var(--warn);border:1px solid #ffc078}
.bar.pri{background:var(--pri-s);color:var(--pri);border:1px solid #b9cbff}
.bar.line,.bar.me{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
.bar.me{color:var(--ink);border-color:var(--ink)}
.bar.sel{box-shadow:0 0 0 2px currentColor}
.slots{grid-template-columns:repeat(3,1fr)!important}
.slot.add{border-color:#b9cbff;text-align:left}
.dot{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:6px}

/* ===== WEB LAYOUT ===== */
.wrap{width:1200px;margin:0 auto;display:flex;align-items:center}
.gnb{height:72px;border-bottom:1px solid var(--line);background:#fff;flex-shrink:0}
.gnb .wrap{height:100%;gap:48px}
.gnb .logo{font-size:21px}
.menu{display:flex;gap:30px;font-size:15px;color:var(--sub);font-weight:600}
.menu span.on{color:var(--ink)}
.gnb-r{margin-left:auto;display:flex;gap:18px;align-items:center}
.btn-sm{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line);font-size:14px;font-weight:600;background:#fff}
.stepbar{background:var(--bg);border-bottom:1px solid var(--line);flex-shrink:0}
.stepbar .wrap{height:80px}
.sb{flex:1;display:flex;align-items:center;gap:12px;color:var(--mute);text-align:left}
.sb:last-child{flex:0 0 auto}
.sb i{font-style:normal;width:30px;height:30px;border-radius:15px;background:#fff;border:1.5px solid #d5dae0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.sb .sl{display:flex;flex-direction:column;line-height:1.35}
.sb .sl b{font-size:15px;white-space:nowrap}
.sb .sl small{font-size:12px;white-space:nowrap}
.sb:not(:last-child)::after{content:"";flex:1;height:2px;background:#e1e5ea;margin:0 18px;min-width:30px}
.sb.on{color:var(--ink)}
.sb.on i{background:var(--pri);border-color:var(--pri);color:#fff}
.sb.done{color:var(--sub)}
.sb.done i{background:var(--pri-s);border-color:#b9cbff;color:var(--pri)}
.sb.done::after{background:#b9cbff}
.main{flex:1;display:block;padding:48px 0 88px}
.layout{width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:56px;align-items:start}
.col{width:auto;min-width:0}
.aside{position:sticky;top:24px;display:flex;flex-direction:column;gap:16px}
.panel{border:1px solid var(--line);border-radius:16px;padding:20px 22px;background:#fff}
.panel.soft{background:var(--bg);border-color:transparent}
.panel-t{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.panel-t .link{margin-left:auto;font-size:13px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:8px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--sub)}
.kv b{font-weight:700;text-align:right}
.kv .link{white-space:nowrap;flex-shrink:0}
.kv b.q{color:var(--pri);font-weight:600}
.big-amt{font-size:28px;font-weight:800;color:var(--pri);letter-spacing:-.5px;margin:2px 0}
.tray{display:flex;flex-direction:column;gap:6px;margin:4px 0 14px}
.tray div{font-size:14px;display:flex;align-items:center;gap:8px}
.tray .dot{width:8px;height:8px;border-radius:4px}
.btn.full{width:100%;height:46px;font-size:15px}
.cta{position:static;background:none;padding:0;margin-top:44px;display:flex;gap:10px;justify-content:flex-end}
.cta .btn.wide{flex:none;width:auto;min-width:260px}
h1{font-size:32px}
.chatpanel{border:1px solid var(--line);border-radius:20px;padding:26px 26px 20px;margin-top:28px;background:#fff}
.chatpanel .chat{margin-top:0}
.chatpanel .bub{max-width:76%}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.scard{border:1.5px solid var(--line);border-radius:16px;padding:20px;text-align:left;display:flex;flex-direction:column;gap:6px;background:#fff}
.scard:hover{border-color:#b9cbff}
.scard.on{border-color:var(--pri);background:var(--pri-s)}
.scard .top0{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.scard .top0 .radio{margin-left:auto}
.scard .name{font-size:17px;font-weight:800}
.scard .amt{font-size:24px;font-weight:800;letter-spacing:-.4px}
.scard.on .amt{color:var(--pri)}
.scard .meta{font-size:13px;color:var(--sub);line-height:1.5}
.ft{border-top:1px solid var(--line);background:var(--bg);flex-shrink:0}
.ft .wrap{height:84px;gap:16px;font-size:13px;color:var(--sub)}
.ft b{color:var(--ink);font-size:15px}
.ft .r{margin-left:auto}
/* easy mode on web: one centered column, no sidebar */
.easy .layout{grid-template-columns:1fr;width:880px}
.easy .aside{display:none}
.easy .cta{justify-content:stretch}
.easy .cta .btn.wide{flex:1;width:100%}
.easy .sb .sl b{font-size:17px}

.hrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.hrow:last-of-type{border-bottom:0}
.hrow .pin{width:26px;height:26px;font-size:12px;color:#fff}
.hn{font-size:15px;font-weight:700}
.hm{font-size:13px;color:var(--sub)}
.hrow .link{white-space:nowrap}
#kmap{width:100%;height:380px;border-radius:14px;background:#f2f4f6}
.kpin{padding:4px 10px;border-radius:14px;color:#fff;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.kpin.dest{background:#fab005;color:#191f28}

/* ===== RAG ===== */
:root{--ai:#7048e8;--ai-s:#f3efff;--ai-l:#d0bfff}
.ragbox{border:1.5px solid var(--ai-l);background:#fbf9ff;border-radius:16px;padding:20px 22px;margin-top:14px}
.show-rag .ragmark{outline:2px dashed #9775fa;outline-offset:6px;border-radius:14px;position:relative}
.show-rag .ragmark::after{content:'RAG';position:absolute;top:-16px;right:8px;background:#7048e8;color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:8px;letter-spacing:.5px}
.aitag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--ai-s);color:var(--ai);white-space:nowrap}
.aichip{border:1px solid var(--ai-l);background:#fff;color:var(--ai);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer}
.aichip.on{background:var(--ai);color:#fff;border-color:var(--ai)}
.why{border:0;background:var(--ai-s);color:var(--ai);font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;cursor:pointer;margin-left:6px}
.qb{background:#f2f4f6;border-radius:14px 14px 4px 14px;padding:10px 14px;margin:14px 0 0 auto;width:fit-content;max-width:88%;font-size:15px}
.ab{border:1px solid var(--ai-l);background:#fff;border-radius:14px 14px 14px 4px;padding:14px 16px;margin-top:10px;font-size:15px;line-height:1.7}
.ab .who{font-size:12px;font-weight:800;color:var(--ai);margin-bottom:4px;display:flex;gap:8px;align-items:center}
.ab sup{color:var(--ai);font-weight:800;font-size:11px;margin-left:1px}
.ab .src{margin-top:10px;border-top:1px solid #eee;padding-top:8px;font-size:13px;color:var(--sub)}
.ab .src .qt{display:block;margin:3px 0 6px;padding-left:10px;border-left:3px solid var(--ai-l);color:var(--ink)}
.ab.load{color:var(--sub)}
.ab .calc{display:block;margin-top:6px;font-size:13px;color:var(--sub)}
.askin{display:flex;gap:8px;margin-top:14px}
.askin input{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit;font-size:15px}
.askin button{background:var(--ai);color:#fff;border:0;border-radius:12px;padding:0 18px;font-weight:700;cursor:pointer}
.jrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.jrow:last-child{border-bottom:0}
.jrow .nm{font-weight:700}.jrow .mt{font-size:13px;color:var(--sub)}
.jb{margin-left:auto;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
.jb.ok{background:#e6f8f1;color:#099268}.jb.no{background:#fdeaea;color:#d64545}.jb.q{background:#f0f1f3;color:var(--sub)}.jb.cond{background:#fff4e6;color:#e8590c}
.jq{display:block;margin-top:4px;font-size:12.5px;color:var(--ink);padding-left:8px;border-left:3px solid var(--ai-l)}
.fab{position:fixed;right:28px;bottom:28px;z-index:40;background:var(--ai);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-size:15px;font-weight:800;box-shadow:0 8px 24px rgba(124,58,237,.35);cursor:pointer;display:flex;gap:8px;align-items:center}
.drawer{position:fixed;right:24px;bottom:24px;z-index:50;width:400px;max-width:calc(100vw - 32px);height:min(640px,calc(100vh - 48px));background:#fff;border:1px solid var(--ai-l);border-radius:20px;box-shadow:0 16px 48px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden}
.drawer .dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.drawer .dh b{font-size:16px}
.drawer .db{flex:1;overflow:auto;padding:4px 18px 16px}
.drawer .df{padding:12px 14px;border-top:1px solid var(--line)}
.drawer .df .askin{margin-top:0}
.drawer .x{margin-left:auto;border:0;background:none;font-size:22px;color:var(--sub);cursor:pointer}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sugg .aichip{font-size:13px;padding:6px 11px;text-align:left}
.toggle.ai .sw.on{background:var(--ai)}

/* ===== 2단계 (민선 수정 · 2026-11-12 합침) ===== */
:root {--ok:#0ca678;--ok-t:#099268;--ok-s:#e6fcf5;--warn-t:#e8590c}
/* ===== 2단계 지원 추천 (파랑 메인 · 보라 AI · 초록 좋음 · 주황 주의) ===== */
.s2  {font-variant-numeric: tabular-nums;}
.s2 h1  {font-size: 34px;line-height: 1.38;letter-spacing: -1.2px;margin-top: 4px;}
.s2 h1 em  {font-style: normal;color: var(--pri);}
.mbar  {display: flex;gap: 3px;height: 10px;margin-top: 28px;border-radius: 5px;overflow: hidden;}
.mbar .b1,
.mleg .b1  {background: var(--pri);}
.mbar .b2,
.mleg .b2  {background: #5c8dff;}
.mleg  {display: flex;gap: 24px;margin-top: 12px;font-size: 14px;color: var(--sub);}
.mleg i  {display: inline-block;width: 8px;height: 8px;border-radius: 2px;margin-right: 7px;vertical-align: 1px;}
.mleg b  {color: var(--ink);font-weight: 700;margin-left: 6px;}
.s2-sec  {margin-top: 64px;}
.s2-h  {display: flex;align-items: baseline;gap: 8px;margin-bottom: 18px;}
.s2-h h2  {font-size: 21px;font-weight: 800;letter-spacing: -0.6px;}
.s2-h .n  {font-size: 21px;font-weight: 800;color: var(--ok-t);}
.s2-h .r  {margin-left: auto;font-size: 13px;color: var(--sub);}
.ai-by  {display: inline-flex;align-items: center;gap: 6px;font-size: 13px;font-weight: 600;color: var(--ai) !important;}
.ai-by::before  {content: "";width: 6px;height: 6px;border-radius: 3px;background: var(--ai);}
/* 지금 신청 카드 */
.ncards  {display: grid;grid-template-columns: repeat(3, 1fr);gap: 12px;}
.ncard  {text-align: left;border: 1px solid var(--line);border-radius: 18px;padding: 20px 20px 18px;background: #fff;display: flex;flex-direction: column;min-height: 196px;transition:
    border-color 0.15s,
    box-shadow 0.15s,
    transform 0.15s;}
.ncard:hover  {border-color: #c9d0d8;transform: translateY(-2px);}
.ncard.on  {border-color: var(--pri);box-shadow: 0 0 0 1px var(--pri);}
.ncard .dd  {font-size: 26px;font-weight: 800;letter-spacing: -0.8px;color: var(--warn);}
.ncard .dd.always  {color: var(--ok);}
.ncard .nn  {font-size: 16px;font-weight: 700;line-height: 1.45;margin-top: 12px;word-break: keep-all;}
.ncard .nb  {font-size: 14px;color: var(--sub);margin-top: 4px;word-break: keep-all;}
.ncard .no  {margin-top: auto;padding-top: 16px;font-size: 13px;color: var(--mute);}
.npanel  {margin-top: 12px;background: var(--bg);border-radius: 18px;padding: 22px 24px;}
.np-h  {display: flex;align-items: center;gap: 10px;}
.np-h b  {font-size: 16px;}
.np-x  {margin-left: auto;font-size: 13px;color: var(--sub);}
.np-why  {font-size: 15px;line-height: 1.7;margin-top: 8px;}
.np-q  {margin-top: 14px;padding-left: 12px;border-left: 2px solid var(--ai-l);font-size: 14px;color: var(--sub);line-height: 1.7;}
.np-q mark  {background: none;color: var(--ink);font-weight: 700;}
/* 12월 타임라인 */
.tl  {border: 1px solid var(--line);border-radius: 18px;padding: 18px 24px 14px;}
.tl-body  {position: relative;}
.tl-grid  {position: absolute;left: 150px;right: 0;top: 0;bottom: 0;pointer-events: none;}
.tl-grid i  {position: absolute;top: 0;bottom: 0;border-left: 1px dashed #dfe3e8;}
.tl-grid i:first-child  {border-left: 2px solid var(--pri);}
.tl-row  {display: grid;grid-template-columns: 150px 1fr;align-items: center;height: 44px;}
.tl-lb  {font-size: 14px;font-weight: 600;}
.tl-tr  {position: relative;height: 100%;}
.tl-bar  {position: absolute;top: 50%;transform: translateY(-50%);height: 12px;border-radius: 6px;display: block;transition: height 0.15s;}
.tl-bar.ok  {background: var(--ok);}
.tl-bar.ok:hover,
.tl-bar.sel  {height: 18px;border-radius: 9px;}
.tl-bar.me  {background: var(--ink);}
.tl-axis  {display: grid;grid-template-columns: 150px 1fr;margin-top: 6px;}
.tl-ax  {position: relative;height: 38px;}
.tl-tk  {position: absolute;top: 0;transform: translateX(-50%);font-size: 12px;color: var(--sub);text-align: center;white-space: nowrap;line-height: 1.45;}
.tl-tk b  {display: block;color: var(--ink);font-size: 13px;}
.tl-tk.first  {transform: none;text-align: left;color: var(--pri);font-weight: 700;}
.tl-tk.last  {transform: translateX(-100%);text-align: right;}
/* 2단계 달력 */
.s2 .cal  {border-radius: 18px;padding: 20px 22px 14px;}
.s2 .cal-h  {margin-bottom: 16px;}
.s2 .cal-h b  {font-size: 18px;letter-spacing: -0.3px;}
.s2 .cal-lg  {font-size: 13px;gap: 16px;}
.s2 .dow  {font-weight: 600;padding: 0 8px 8px;}
.s2 .wk  {min-height: 68px;border-top-color: #f0f2f4;}
.s2 .dn  {font-size: 13px;font-weight: 500;padding: 8px 8px 4px;}
.s2 .dn.past  {color: var(--mute);}
.s2 .dn.sun  {color: var(--warn-t);}
.s2 .dn.sun.past,
.s2 .dn.out  {color: #d5dae0;}
.s2 .dn.today span  {padding: 3px 7px;}
.s2 .bars  {grid-auto-rows: 26px;row-gap: 4px;}
.s2 .bar  {border-radius: 7px;font-size: 12.5px;padding: 0 10px;transition: filter 0.15s;}
.s2 .bar[onclick]:hover  {filter: brightness(0.96);}
.s2 .bar.sel  {box-shadow: 0 0 0 2px currentColor;}
.tl-note  {font-size: 14px;color: var(--sub);margin-top: 14px;line-height: 1.7;}
.tl-note b  {color: var(--ink);}
/* 내년 지원 */
.yl  {border-top: 2px solid var(--ink);}
.yrow  {display: flex;align-items: center;gap: 20px;padding: 22px 0;border-bottom: 1px solid var(--line);}
.yrow-b  {flex: 1;min-width: 0;display: flex;align-items: center;gap: 20px;text-align: left;}
.yn  {font-size: 17px;font-weight: 700;display: flex;align-items: center;gap: 6px;}
.yrow-b:hover .yn  {color: var(--pri);}
.yd  {font-size: 14px;color: var(--sub);margin-top: 4px;}
.ya  {margin-left: auto;font-size: 24px;font-weight: 800;color: var(--pri);letter-spacing: -0.8px;white-space: nowrap;}
.ya small,.ysum b small,.wres .big small  {font-size: 15px;font-weight: 700;margin-left: 3px;letter-spacing: 0;}
.alarm  {width: 118px;height: 38px;border: 1px solid var(--line);border-radius: 10px;font-size: 13px;font-weight: 700;background: #fff;flex-shrink: 0;}
.alarm:hover  {border-color: var(--pri);color: var(--pri);}
.alarm.on  {background: var(--pri);color: #fff;border-color: var(--pri);}
.alarm-sp  {width: 118px;flex-shrink: 0;}
.ysum  {display: flex;align-items: center;gap: 20px;padding: 18px 0;}
.ysum span:first-child  {font-size: 15px;font-weight: 700;color: var(--sub);}
.ysum b  {margin-left: auto;font-size: 24px;font-weight: 800;letter-spacing: -0.8px;}
.ydet  {background: var(--bg);border-radius: 16px;padding: 18px 22px;margin: 0 0 18px;}
.ydet .ev  {grid-template-columns: 120px 14px 1fr auto;font-size: 14px;gap: 9px 8px;margin-top: 0;}
.ydet .ev .v  {color: var(--ink);}

/* ===== 2단계 판정 · 1단계 답(S.prof)으로 계산 (policy_match.py 규칙을 옮김) =====

   코드가 확실히 판정: 나이 · 무주택 · 연소득(이자지원·대출보증)

const MED1 = 256.4;
function me(o){ const P=S.prof||{}, sp=S.sep||P.sep; return {age:P.age||27, inc:P.income!=null?P.income:230, own:(S.own||P.own)==='있어요', sep:sp==='네'||sp==='모름', sepQ:sp==='모름', cash:P.cash!=null?P.cash:2000, job:P.job||'직장인', ...(o||{})}; }   // sep '모름'은 '네'와 같이 다뤄요 → 국토부 독립거주 '확인 필요'
/* 2단계 근거 '○월 서울 입주' 문구 = 1단계 입주 시기 (판정에는 안 써요) */
function moveIn(){ const w=(S.prof||{}).when, m=+TODAY1.slice(5,7);
  if(!w||w==='다음 달') return `${m%12+1}월 서울 입주`; if(w==='이번 달') return `${m}월 서울 입주`;
  if(/^\d{1,2}월$/.test(w)) return `${w} 서울 입주`; if(w==='3개월 안') return '3개월 안 서울 입주'; return '서울 입주 (시기 미정)'; }
function judge(o){
  const m=me(o), pct=Math.round(m.inc/MED1*100), yinc=m.inc*12;
  const age=(lo,hi)=>[`만 ${m.age}세`,`만 ${lo}~${hi}세`, m.age>=lo&&m.age<=hi?'ok':'no', `만 ${lo}~${hi}세 대상 (지금 만 ${m.age}세)`];

  const inc150=lo=>[incK, `기준 중위소득 ${lo?'48% 초과 ~ ':''}150% 이하`, m.inc>MED1*1.5||(lo&&m.inc<=MED1*.48)?'no':'q', m.inc>MED1*1.5?`소득이 중위 150%를 넘어요 (지금 약 ${pct}%)`:`소득이 중위 48% 이하예요 (지금 약 ${pct}%) · 주거급여 대상일 수 있어요`];
  const ev={
    molit:[age(19,34), home('무주택'), m.sep?[m.sepQ?'부모님과 같은 주소인지 모름':'부모님과 같은 주소','독립거주 (이사하며 세대 분리하면 충족)','q']:['부모님과 따로 살아요','독립거주','ok'], ['공공임대 아님','공공임대 거주자 제외','ok'], [incK,'청년가구 중위 60% · 원가구 중위 100% 이하','q']],
    move:[age(19,39), [moveIn(),'서울 전입 후 전입신고','ok'], home('무주택 임차가구'), [`보증금 ${m.cash.toLocaleString()}만 원 예산`,'거래금액 2억 원 이하', m.cash<=15000?'ok':'q'], inc150(false)],

  };
  const AMT={molit:480, move:40, seoul:240};
  const list=POL.map(p=>{ const e=ev[p.id]; let st=e.some(x=>x[2]==='no')?'no':'ok'; if(o&&o.noMolit&&p.id==='molit') st='no';
    const why=e.filter(x=>x[2]==='no').map(x=>x[3]||x[1]);
    if(o&&o.noMolit&&p.id==='molit') why.push('소득 조건 안 맞음');
    return {...p, ev:e, st, why, amtN:st==='ok'?AMT[p.id]:0}; });
  const by=Object.fromEntries(list.map(p=>[p.id,p]));
  let ex=null; if(by.molit.st==='ok'&&by.seoul.st==='ok'){ by.seoul.st='dup'; by.seoul.amtN=0; ex=by.seoul; }
  const chosen=list.filter(p=>p.st==='ok'), fail=list.filter(p=>p.st==='no');
  return {m, pct, yinc, list, chosen, fail, ex, total:chosen.reduce((s,p)=>s+p.amtN,0)};
}

function whatifs(){

  const diff=(K,extra)=>{ const a=J.chosen.map(p=>p.id), b=K.chosen.map(p=>p.id);

  const tgt=m.age<35?35:m.age<40?40:null;
  if(tgt){ const d=diff(judge({age:tgt}), tgt===35&&m.age<=34&&m.inc*12<=7000&&!m.own?['청년 전월세 대출보증 (만 34세까지)']:[]); if(d.plus.length||d.minus.length) out.age={label:`만 ${tgt}살이 되면`, ...d}; }
  if(J.chosen.some(p=>p.id==='molit')) out.income={label:'국토부 소득 조건이 안 맞으면', ...diff(judge({noMolit:true}))};
  const plus=[]; if(m.inc*12<=4000&&!m.own&&m.age<=39) plus.push('서울시 청년 임차보증금 이자지원 (연 2.0% 이자 지원)'); if(!m.own) plus.push('전세보증금반환보증 보증료 지원');

  if(plus.length||rentPol.length) out.jeonse={label:'전세로 계약하면', total:null, plus, minus:rentPol.length?[rentPol.map(p=>p.name).join('·')+' (월세 거주 조건)']:[]};

function matchQ(t){
  const has=r=>r.test(t);
  if(has(/1년|재직|신입|입사/)) return 'loan1y';
  if(has(/중복|같이|둘 ?다|동시/)) return 'dupRent';
  if(has(/전세|이자|보증금/)) return 'deposit';
  if(has(/역삼|60만|월세 ?[6-9]\d ?만|서울시.*(안|못)/)) return 'seoulRent';
  if(has(/35|나이/)) return 'age35';
  if(has(/언제|기간|내년|공고/)) return 'when';
  if(has(/12개월|끝나|종료/)) return 'rent12';
  if(has(/청년주택|안심주택|SH|대기|입주/)) return 'sh';
  if(has(/이사비|이사/)) return 'move';
  if(has(/대출|버팀목/)) return 'loan1y';
  return 'none';
}

let API_OK = null;
function apiCheck(){
  if(!location.protocol.startsWith('http')){ API_OK=false; return; }
  fetch('/api/health').then(r=>r.ok?r.json():null).then(j=>{ API_OK=!!(j&&j.ok); render(); }).catch(()=>{ API_OK=false; });
}
function apiProfile(){ const P=S.prof||{}; return {age:P.age||27, income_monthly:P.income, job:P.job, homeless:S.own!=='있어요', area:{}}; }
function apiAsk(q){
  return fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q, profile:apiProfile()})})
    .then(r=>r.ok?r.json():null).catch(()=>null);
}
const esc = t => String(t==null?'':t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function apiCard(r, q){
  const a = esc(r.answer).replace(/\n/g,'<br>').replace(/\[(\d+)\]/g,'<sup>[$1]</sup>');
  const tag = r.found===false ? '<span class="jb q" style="margin:0">근거 없음 → 상담 연결</span>'
    : `<span class="aitag">${r.mode==='AI'?'AI 답변':'공고문 원문'} · 근거 ${r.sources.length}건</span>`;
  return `${q?`<div class="qb">${esc(q)}</div>`:''}<div class="ab"><div class="who">주거 상담 AI ${tag}</div>${a}
    <div class="src">${r.sources.map(s=>`[${s.n}] ${esc(s.name)} · ${esc(s.section)}${s.url&&/^https?:/.test(s.url)?` · <a href="${esc(s.url)}" target="_blank" rel="noopener" style="color:var(--pri)">원문 보기</a>`:''}<span class="qt">"${esc((s.text||'').slice(0,160))}${(s.text||'').length>160?'…':''}"</span>`).join('')}</div></div>`;
}
function ask3(q, k){   // q: 질문 문장 · k: 예시 질문 키 (서버가 없을 때 미리 넣어 둔 답)
  q=(q||'').trim(); if(!q) return;
  if(!location.protocol.startsWith('http')){ S.q3res=null; S.q3k=k||null; S.q3t=k?null:q; S.q3=k||matchQ(q); render(); return; }
  Object.assign(S,{q3:null, q3res:null, q3t:q, q3k:k||null, q3load:true}); render();
  apiAsk(q).then(r=>{ S.q3load=false; API_OK=!!r; if(r) S.q3res=r; else S.q3=k||matchQ(q); render(); });   // 서버가 늦게 켜져도 질문할 때마다 다시 시도
}

/* 선택형으로 대체(2026-11-17) */ function redo1(label){ const map={'나이':'age','상황':'job','자주 가는 곳':'place','보증금으로 쓸 돈':'cash','한 달 수입':'income','출퇴근 시간':'time','입주 시기':'when','내 집':'own','주소':'sep'};

/* 선택형으로 대체(2026-11-17) */ const prof1 = () => ({...S.prof, own:S.own, sep:S.sep});
/* 선택형으로 대체(2026-11-17) */ function apply1(prof, k, v){   // 끝난 뒤 바뀐 값 저장 (집 유무·세대 분리는 S.own·S.sep 에 따로)

/* ===== 1단계 한 화면 선택형 입력 (2026-11-17 · 시안 step1_page.html) =====
   9개 항목을 한 화면에 두고, 항목마다 맞는 입력 도구로 골라요. 글자 해석(typed1 등)은 쓰지 않아요.
   항목 정의(이름·보조 문구·버튼 값)는 web/step1_rules.js 의 FIELDS 예요. 고르는 즉시 저장해요.
   저장 형식은 예전과 같아요 (2·3단계가 그대로 읽어요)
     S.prof {age 만 나이, birthYear, bday 'after'|'before'|null, job, place, placeOk, cash 만 원, income 만 원(세전 월),
             incomeInput {mode '월'|'연', amount}, time 분(상관없음 999), when} · S.own · S.sep '네'|'아니요'|'모름' · setDest(name, query)
   S.d1 = 입력 중인 글자(숫자칸·검색칸·한 번에 말하기) · S.hl = [받을 수 있는 지원 보기]를 눌렀을 때 강조할 빈 항목 */
const W1 = SR.FIELDS, F1K = Object.fromEntries(W1.map(f => [f.k, f])), NOW_Y = +TODAY1.slice(0,4);
const YEARS1 = (([a,b]) => Array.from({length:b-a+1}, (_,i) => b-i))(F1K.age.years);   // 2010 → 1960
const INC_LIMIT = MED1 * 1.5;   // 지원 소득 기준 안내 (판정 아님) · judge()의 inc150 과 같은 값

  const m = new Map();
  F1K.place.opts.forEach(([n, v]) => m.set(n, {name:n, query:v.query, area:''}));
  Object.entries(SR.KNOWN_PLACES).forEach(([a, l]) => l.forEach(([n, q]) => m.has(n) ? (m.get(n).area = a) : m.set(n, {name:n, query:q, area:a})));
  return [...m.values()];
})();
const D1 = () => S.d1 || (S.d1 = {});

function done1(k){ const P = S.prof || {};
  return k==='own' ? !!S.own : k==='sep' ? !!S.sep : k==='place' ? !!(P.place && P.placeOk) : (k==='job'||k==='when') ? !!P[k] : P[k] != null; }
const lbl1 = (k, v) => (F1K[k].opts.find(o => o[1]===v) || [v])[0];

  switch(k){

}

/* 출생연도 → 만 나이: 생일 전후로 판정이 갈리는 연도만 생일을 물어요.
   경계는 하드코딩하지 않고 judge()·moreJ()를 (나머지는 예시 값으로) 두 나이로 돌려서 결과가 다른지로 정해요.
   2026-11-21 기준이면 2007·1991·1986년생 (만 18/19 · 34/35 · 39/40) */
const AGE_SPLIT1 = {};

  if(y in AGE_SPLIT1) return AGE_SPLIT1[y];

  const sig = age => { S.prof = {age}; S.own = null; S.sep = null; return JSON.stringify([judge().list.map(p => p.st), moreJ().map(r => r.j || '')]); };
  let r; try { r = sig(a) !== sig(a - 1); } finally { Object.assign(S, keep); }
  return AGE_SPLIT1[y] = r;
}

  S.prof = P; render(); focusId('f1-year'); }

/* 자주 가는 곳 · 실제 장소 검색: 카카오 JS 키가 있으면 브라우저에서, 없으면 서버 /api/place (.env 의 REST 키, 키는 브라우저에 안 둬요)

  if(!(liveOn1() && q.trim() && d.kres)) return placeHits(q);

    .catch(() => { window._psfail = true; })      // 서버 꺼짐·키 없음 → 후보 목록으로
    .finally(() => { const e = document.getElementById('f1-plist'); if(e){ e.innerHTML = placeItems(); roving1(); } });
}

  loadKakao().then(() => new kakao.maps.services.Places().keywordSearch(q, (r, st) => { if(D1().pq !== q) return;
      D1().kres = st === kakao.maps.services.Status.OK ? r.slice(0, 8).map(x => ({name:x.place_name, query:x.road_address_name || x.address_name || x.place_name, area:x.road_address_name || x.address_name, live:true})) : [];

function pickPlace1(j){ const p = placeList1()[j]; if(!p) return;
  setDest(p.name, p.query); S.prof = {...S.prof, place:p.name, placeOk:true}; Object.assign(D1(), {pedit:false, pq:'', kres:null});

/* 보증금 · 한 달 수입: 숫자 입력(만 원) + 빠른 선택 · 값이 맞으면 바로 저장, 비우거나 범위를 넘으면 빈 항목 */
const digits1 = s => String(s || '').replace(/[^\d]/g, '').replace(/^0+(?=\d)/, '').slice(0, 6);
function numStr1(k){ const d = D1(), P = S.prof || {};

const monthly1 = () => { const v = numStr1('income'); return v === '' ? null : incMode1()==='연' ? Math.round(+v / 12) : +v; };

  else { const m = monthly1(), ok = m != null && m <= F1K.income.range[1];

function quick1(k, j){ const v = String(quickList1(k)[j][1]); D1()[k==='cash' ? 'cashV' : 'incV'] = v; save1n(k); render(); focusId(`f1-${k}-q${j}`); }
function mode1(m){ if(incMode1() === m) return; D1().incMode = m; save1n('income'); render(); focusId('f1-mode-' + m); }

function quickItems(k){ const v = numStr1(k);
  return quickList1(k).map((o, j) => { const on = v !== '' && +v === o[1];

}
function refresh1(k){   // 숫자를 치는 동안은 화면 전체를 다시 그리지 않고 바뀌는 곳만 (입력 커서 유지)

/* 버튼 그룹(role=radiogroup)은 Tab 한 번에 한 그룹(고른 버튼 또는 첫 버튼만 Tab 자리), 그룹 안에서는 화살표로 옮겨 다녀요 */
function roving1(){ document.querySelectorAll('#root [role="radiogroup"]').forEach(g => { const rs = [...g.querySelectorAll('[role="radio"]')];
  const c = rs.find(r => r.getAttribute('aria-checked') === 'true') || rs[0]; rs.forEach(r => { r.tabIndex = r === c ? 0 : -1; }); }); }

  const g = t.closest('[role="radiogroup"]'), d = {ArrowRight:1, ArrowDown:1, ArrowLeft:-1, ArrowUp:-1}[e.key]; if(!g || !d) return;
  e.preventDefault(); const rs = [...g.querySelectorAll('[role="radio"]')]; rs[(rs.indexOf(t) + d + rs.length) % rs.length].focus(); });

function first1(k){   // 그 항목의 첫 입력 도구
  const r = document.getElementById('f1-' + k); if(!r) return null;
  return r.querySelector('[aria-checked="true"]') || r.querySelector('select, input, button'); }
function to1(k, hl){ const r = document.getElementById('f1-' + k); if(!r) return;
  if(hl){ r.classList.add('hl'); setTimeout(() => r.classList.remove('hl'), 2500); }

async function nearest(loc, how){

async function drawKakao(){
  const el = document.getElementById('kmap'); if(!el) return;
  try { await loadKakao(); } catch(e){ window._kfail = true; render(); return; }
  let vis = _kvis; if(!vis){ vis = {}; S.homes.forEach(i => vis[HOMES[i].key] = 'on'); }
  const map = new kakao.maps.Map(el, { center: new kakao.maps.LatLng(37.52, 127.0), level: 8 });
  const bounds = new kakao.maps.LatLngBounds();
  const dest = await geocode(DEST.addr); bounds.extend(dest);
  new kakao.maps.Marker({ map, position: dest });
  new kakao.maps.CustomOverlay({ map, position: dest, yAnchor: 2.8, content: `<div class="kpin dest">★ 자주 가는 곳 · ${DEST.name}</div>` });
  const shown = HOMES.filter(h => vis[h.key]);
  for(const h of shown){
    const p = await geocode(h.addr); bounds.extend(p);
    const op = vis[h.key] === 'ghost' ? .45 : 1, t = (h.route === '걸어서' ? '걸어서 ' : '') + h.commute + '분' + (h.route === '걸어서' ? '' : ' · ' + h.route.split(' · ')[0]);
    new kakao.maps.Marker({ map, position: p, opacity: op });
    new kakao.maps.CustomOverlay({ map, position: p, yAnchor: 1.7, content: `<div class="kpin" style="background:${h.color};opacity:${op}">${h.key} ${h.label} · ${t}</div>` });
    new kakao.maps.Polyline({ map, path: [p, dest], strokeWeight: 3, strokeColor: h.color, strokeOpacity: .8 * op, strokeStyle: 'dash' });
    new kakao.maps.Circle({ map, center: p, radius: 500, strokeWeight: 1, strokeColor: h.color, strokeOpacity: .5 * op, strokeStyle: 'dash', fillColor: h.color, fillOpacity: .06 * op });
  }
  if(shown.length) map.setBounds(bounds, 80, 80, 80, 80); else { map.setCenter(dest); map.setLevel(7); }
}

/* 3단계 · 이 집에서 받을 수 있는 지원 = 내 조건(2단계 judge) × 집 조건(보증금·월세) · 코드 판정 */
function houseSupport(h){
  const J=judge(), by=Object.fromEntries(J.list.map(p=>[p.id,p])), d=val(h,'deposit'), r=val(h,'rent');
  const person=id=>by[id].st!=='no', pwhy=id=>by[id].why.join(', ');
  const sv=d*0.05/12+r, amt=d+r*100;
  const molit = person('molit') ? {ok:true, t:'월 '+Math.min(r,20)+'만 원 × 24개월'} : {ok:false, t:pwhy('molit')};
  let seoul;
  if(!person('seoul')) seoul={ok:false, t:pwhy('seoul')};
  else if(d>8000) seoul={ok:false, t:`보증금 8천만 원 초과 (이 집 ${d.toLocaleString()}만 원)`};
  else if(r>60 && sv>93) seoul={ok:false, t:`월세 60만 원 초과 · 보증금×5%÷12+월세 = ${r1(sv)}만 원 (93만 원 넘음)`};
  else seoul={ok:true, t:'월 '+Math.min(r,20)+'만 원 × 12개월'};
  if(seoul.ok && molit.ok){ seoul.dup=true; seoul.t='조건은 맞지만 국토부와 같이 못 받아요'; }
  const move = !person('move') ? {ok:false, t:pwhy('move')} : amt>20000 ? {ok:false, t:`거래금액 2억 원 초과 (환산 ${amt.toLocaleString()}만 원)`} : {ok:true, t:'중개보수 + 이사비 최대 40만 원'};
  const monthSup = molit.ok||seoul.ok ? Math.min(r,20) : 0;
  return {molit, seoul, move, monthSup, total:(molit.ok?Math.min(r,20)*24:seoul.ok?Math.min(r,20)*12:0)+(move.ok?40:0)};
}

    <div class="sec"><div class="sec-t"><span class="ico sm">${svgIcon('receipt')}</span>비용 · 오가는 시간 <small>월세 + 관리비 = 한 달 실부담 · 교통비는 참고</small></div>
      <table><tr><th style="width:22%"></th>${th}</tr>
        <tr><td class="s">보증금</td>${H.map(h=>{const c=me().cash, d=val(h,'deposit');return `<td>${d.toLocaleString()}만 원${d>c?` <span class="pill warn">${(d-c).toLocaleString()}만 원 부족</span>`:''}</td>`}).join('')}</tr>
        <tr><td class="s">월세</td>${H.map(h=>`<td>${val(h,'rent')}만 원</td>`).join('')}</tr>
        <tr><td class="s">관리비</td>${H.map(h=>`<td>${val(h,'fee')?val(h,'fee')+'만 원':'<span class="s">–</span>'}</td>`).join('')}</tr>
        <tr><td style="font-weight:700">한 달 실부담</td>${H.map(h=>`<td class="${monthly(h)===minM?'best':''}"><b class="v">${monthly(h)}만 원</b></td>`).join('')}</tr>
        <tr><td class="s">교통비 (한 달, 참고)</td>${H.map(h=>`<td>${fareMonth(h)?fareMonth(h)+'만 원':'0원 (걸어서)'}</td>`).join('')}</tr>
        <tr><td style="font-weight:700">${DEST.name}까지</td>${H.map(h=>`<td class="${h.commute===minT?'best':''}"><b class="v">${h.commute}분</b>${S.prof&&S.prof.time&&S.prof.time<999&&h.commute>S.prof.time?` <span class="pill warn">${S.prof.time}분 넘음</span>`:''}<span class="w">${h.route.split(' · ')[0]}</span></td>`).join('')}</tr>
      </table>
      <p class="s" style="margin-top:10px">교통비 = ODsay 편도 요금 × 2 × ${DAYS}일, 참고로만 보여주고 실부담·점수에는 넣지 않아요 · 관리비를 넣으면 실부담에 더해져요.${S.prof&&S.prof.cash!=null?` · 보증금은 1단계에서 말한 모아둔 돈 ${me().cash.toLocaleString()}만 원과 비교해요.`:''}</p></div>
    ${supportSec(H, th)}

    <div class="verdict" id="verdict">
      <div class="sec-t" style="margin-bottom:12px"><span class="ico sm">${svgIcon('home')}</span>종합 추천</div>
      <div class="vhead"><span class="pin" style="width:34px;height:34px;border-radius:17px;font-size:15px;background:${top.h.color};align-self:center">${top.h.key}</span><span class="nm">${top.h.label}을 추천해요</span><span class="sc"><b>${top.total}</b>점 / 100</span></div>
      <p class="s" style="margin-top:6px">${PRIO[S.prio].name} 기준 · 비용 ${Math.round(w.cost*100)}% · 시간 ${Math.round(w.time*100)}% · 생활 ${Math.round(w.life*100)}%</p>
      <div style="margin:18px 0 6px"><div style="font-weight:700;font-size:15px;margin-bottom:8px">나한테 제일 중요한 건? <span class="s" style="font-weight:400">고르면 바로 다시 계산돼요</span></div>${prioChips()}</div>
      <div style="margin-top:18px;border-top:1px solid var(--line)">
        ${rank.map((r,i)=>`<div class="rk"><span class="no">${i+1}위</span><span>${tag(r.h)}</span><span class="bar"><span style="width:${r.total}%;background:${r.h.color}"></span></span><span class="t">${r.total}점</span><span class="d" style="grid-column:2/5">비용 ${r.cost} · 시간 ${r.time} · 생활 ${r.life}</span></div>`).join('')}
      </div>
      <div style="margin-top:22px;font-weight:700">이렇게 추천했어요</div>
      <ul class="why-list">${rs.map(t=>`<li>${t}</li>`).join('')}</ul>
      ${wk?`<div class="note warn" style="margin-top:16px"><span class="ic">!</span><div>아쉬운 점 · ${top.h.label}은 ${wk}</div></div>`:''}
      <details style="margin-top:14px"><summary class="s" style="cursor:pointer">점수는 이렇게 계산해요</summary><p class="s" style="margin-top:8px;line-height:1.8">비용: 가장 싼 집 100점, 월 10만 원 비쌀 때마다 −15점<br>시간: 15분 이하 100점, 그 뒤 1분마다 −2점<br>생활: 시설마다 걸어서 5분 이하 100점, 20분 이상 0점 → 8개 평균<br>점수와 숫자는 코드가 계산하고, AI는 이 근거로만 설명해요.</p></details>
    </div>
    <div class="hr"></div>
    <div class="diff" style="margin-top:0"><div><h4 style="color:var(--pri)">데이터로 확인한 것</h4><p class="s">주변 시설 거리 (카카오 로컬) · 오가는 시간·요금 (ODsay)</p></div><div><h4 style="color:var(--warn)">직접 확인해야 할 것</h4><p class="s">관리비 · 건물 용도 · 소음 · 채광 · 수압과 곰팡이</p></div></div>`;
}

function render(){
  const body=[null,step1,step3,step4][S.step]();
  document.getElementById('root').innerHTML=fill(`<div class="app ${S.easy?'easy':''} ${S.ragShow?'show-rag':''}">${header()}<div class="main"><div class="layout"><div class="col">${banner1()}${body}</div><aside class="aside">${aside()}</aside></div></div>${footer()}</div>${loginModal()}`);
  if(document.getElementById('kmap')) drawKakao();
  roving1();   // 버튼 그룹은 Tab 한 번에 한 그룹씩
}
/* ----- 로그인 정보·1단계 조건을 화면 문구에 넣기 ----- */
// {NM} 이름(로그인) · {AGE} 나이 · {INC} 월 소득 · {YINC} 연 소득 (1단계 대화에서 뽑은 값, 없으면 시연 인물 값)
function fill(h){
  const P = S.prof, age = P.age || 27, inc = P.income != null ? P.income : 230;
  const nm = S.user ? S.user.given + '님' : '회원님';
  return h.replace(/\{NM\}/g, nm).replace(/\{AGE\}/g, `만 ${age}세`).replace(/\{INC\}/g, `월 ${inc.toLocaleString()}만 원`).replace(/\{YINC\}/g, `${(inc*12).toLocaleString()}만 원`);
}
function loginModal(){
  if(!S.loginOpen) return '';
  return `<div class="dim" onclick="if(event.target===this)set({loginOpen:false})"><div class="sheet" style="width:420px;text-align:center">
    <div class="sheet-h"><b style="font-size:18px">간편 로그인</b><button class="x" onclick="set({loginOpen:false})">×</button></div>
    <p class="s" style="text-align:left">로그인하면 이름이 화면에 나오고, 결과를 저장하고 공고 알림을 받을 수 있어요.</p>
    <label class="s" style="display:block;text-align:left;margin-top:16px">이름 (시연용 · 실제로는 카카오·네이버 계정 이름을 받아요)
      <span class="inp" style="margin-top:6px"><input id="login-name" value="박정연"></span></label>
    <button class="btn wide" style="margin-top:18px;background:#fee500;color:#191f28" onclick="doLogin('카카오')" data-act="카카오 로그인">카카오로 시작하기</button>
    <button class="btn wide" style="margin-top:8px;background:#03c75a;color:#fff" onclick="doLogin('네이버')" data-act="네이버 로그인">네이버로 시작하기</button>
  </div></div>`;
}
function doLogin(via){
  const name = (document.getElementById('login-name').value || '').trim() || '사용자';
  const given = name.length >= 3 ? name.slice(1) : name;   // 박정연 → 정연
  set({user:{name, given, via}, loginOpen:false});
}
render();
apiCheck();
</script>
</body>
</html>
