<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>첫집 내비 프로토타입</title>
<style>
:root{
  --ink:#191f28; --sub:#6b7684; --mute:#9aa3ad; --line:#e8ebee; --bg:#f7f8fa; --white:#fff;
  --pri:#2f6bff; --pri-d:#1f55d9; --pri-s:#eef3ff;
  --warn:#c2620a; --warn-s:#fff4e8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans KR","Noto Sans CJK KR",-apple-system,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{min-height:100vh;background:var(--white);display:flex;flex-direction:column}

/* header */
.top{height:64px;display:flex;align-items:center;gap:32px;padding:0 32px;border-bottom:1px solid var(--line);background:var(--white);position:sticky;top:0;z-index:5}
.logo{font-weight:800;font-size:19px;letter-spacing:-.3px}
.logo b{color:var(--pri)}
.tabs{display:flex;gap:4px}
.tab{font-size:15px;color:var(--mute);padding:8px 12px;border-radius:8px}
.tab:hover{background:var(--bg)}
.tab.on{color:var(--ink);font-weight:700}
.tab i{font-style:normal;display:inline-flex;width:20px;height:20px;border-radius:10px;background:var(--line);color:var(--sub);font-size:12px;align-items:center;justify-content:center;margin-right:6px}
.tab.on i{background:var(--pri);color:#fff}
.tab.done i{background:var(--pri-s);color:var(--pri)}
.toggle{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--sub)}
.sw{width:46px;height:26px;border-radius:13px;background:#d5dae0;position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.sw.on{background:var(--pri)}
.sw.on::after{left:23px}

/* layout */
.main{flex:1;display:flex;justify-content:center;padding:48px 32px 120px}
.col{width:680px;display:flex;flex-direction:column}
.eyebrow{font-size:14px;font-weight:700;color:var(--pri);margin-bottom:8px}
h1{font-size:28px;line-height:1.4;letter-spacing:-.5px;font-weight:800}
.lead{font-size:16px;color:var(--sub);line-height:1.6;margin-top:8px}
.sec{margin-top:40px}
.sec-t{font-size:17px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sec-t small{font-size:13px;font-weight:500;color:var(--mute)}
.p{font-size:16px;line-height:1.7}
.s{font-size:14px;color:var(--sub);line-height:1.6}
.hr{height:1px;background:var(--line);margin:28px 0}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--pri-s);color:var(--pri)}
.pill.warn{background:var(--warn-s);color:var(--warn)}
.pill.gray{background:var(--bg);color:var(--sub)}

/* buttons */
.btn{white-space:nowrap;flex-shrink:0;height:52px;border-radius:12px;font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 22px}
.btn.pri{background:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.ghost{background:var(--bg);color:var(--ink)}
.btn.wide{width:100%}
.chip{height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--line);font-size:15px;color:var(--ink);background:#fff}
.chip.on{border-color:var(--pri);background:var(--pri-s);color:var(--pri);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.link{color:var(--pri);font-weight:600;font-size:14px;text-align:left}
.back{align-self:flex-start}
.cta .btn.wide{width:auto;flex:1}
.cta{position:sticky;bottom:0;background:linear-gradient(transparent,#fff 30%);padding:24px 0 28px;margin-top:40px;display:flex;gap:10px}

/* chat */
.chat{display:flex;flex-direction:column;gap:14px;margin-top:28px}
.bub{max-width:82%;font-size:16px;line-height:1.65;padding:14px 18px;border-radius:18px}
.bub.me{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:6px}
.bub.ai{align-self:flex-start;background:var(--bg);border-bottom-left-radius:6px}
.who{font-size:13px;color:var(--mute);margin:4px 0 -8px}
.prof{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 20px;margin-top:12px}
.prof div{font-size:13px;color:var(--sub)}
.prof b{display:block;font-size:16px;color:var(--ink);margin-top:2px}
.compose{margin-top:24px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:28px;padding:6px 6px 6px 20px}
.compose input{flex:1;border:0;outline:0;font:inherit;font-size:15px}
.send{width:40px;height:40px;border-radius:20px;background:var(--pri);color:#fff;font-weight:700}

/* list rows (instead of boxes) */
.list{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:16px;padding:18px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:hover{background:#fbfcfd}
.radio{width:22px;height:22px;border-radius:11px;border:2px solid #cfd5dc;flex-shrink:0;position:relative}
.radio.on{border-color:var(--pri)}
.radio.on::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--pri)}
.check{width:22px;height:22px;border-radius:6px;border:2px solid #cfd5dc;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.check.on{background:var(--pri);border-color:var(--pri)}
.row .name{font-size:16px;font-weight:700}
.row .meta{font-size:14px;color:var(--sub);margin-top:3px}
.row .right{margin-left:auto;text-align:right}
.row .amt{font-size:17px;font-weight:800}
.row .amt.pri{color:var(--pri)}
.chev{color:var(--mute);font-size:14px;margin-left:8px;transition:.2s}
.chev.open{transform:rotate(90deg)}
.detail{padding:4px 4px 22px 98px;border-bottom:1px solid var(--line)}

/* evidence */
.ev{display:grid;grid-template-columns:150px 18px 1fr;gap:10px 8px;align-items:center;font-size:15px;margin-top:10px}
.ev .k{color:var(--sub)}
.ev .ar{color:var(--mute)}
.ev .v.ok::before{content:"✓ ";color:var(--pri);font-weight:800}
.ev .v.q{color:var(--warn)}
.ev .v.q::before{content:"? ";font-weight:800}
.quote{margin-top:14px;font-size:14px;line-height:1.7;color:var(--sub);padding-left:14px;border-left:3px solid var(--pri)}
.quote mark{background:#e3ebff;color:var(--ink);padding:0 2px}

/* summary strip */
.strip{display:flex;gap:32px;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.strip div{font-size:13px;color:var(--sub)}
.strip b{display:block;font-size:24px;color:var(--ink);margin-top:4px;letter-spacing:-.4px}
.strip b.pri{color:var(--pri)}

/* note */
.note{display:flex;gap:10px;font-size:15px;line-height:1.65;padding:14px 16px;border-radius:12px;background:var(--bg)}
.note.warn{background:var(--warn-s)}
.note .ic{font-weight:800;color:var(--pri)}
.note.warn .ic{color:var(--warn)}

/* table */
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--sub);font-weight:600;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:15px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.best{color:var(--pri);font-weight:700}
td.best::after{content:" ●";font-size:9px;vertical-align:middle}
tr.clk{cursor:pointer}
tr.clk:hover td{background:#fbfcfd}

/* diff */
.diff{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:16px}
.diff h4{font-size:14px;margin-bottom:6px}
.plus h4{color:var(--pri)} .minus h4{color:var(--warn)}

/* map */
.map{border-radius:14px;overflow:hidden;background:#f1f3f6}

/* modal sheet */
.dim{position:fixed;inset:0;background:rgba(25,31,40,.35);display:flex;align-items:center;justify-content:center;z-index:20}
.sheet{width:720px;background:#fff;border-radius:20px;padding:32px;max-height:88vh;overflow:auto}
.sheet-h{display:flex;align-items:center;margin-bottom:18px}
.x{margin-left:auto;font-size:22px;color:var(--sub)}

/* ===== EASY MODE ===== */
.easy .col{width:720px}
.easy h1{font-size:38px;line-height:1.35}
.easy .lead{font-size:22px;color:var(--ink)}
.easy .eyebrow{font-size:18px}
.easy .p,.easy .bub{font-size:22px}
.easy .s{font-size:19px;color:#4e5968}
.easy .btn{height:76px;font-size:24px;border-radius:16px}
.easy .tab{font-size:17px}
.easy .toggle{font-size:18px;color:var(--ink)}
.easy .sw{width:58px;height:32px;border-radius:16px}
.easy .sw::after{width:26px;height:26px;border-radius:13px}
.easy .sw.on::after{left:29px}
.big-q{display:flex;flex-direction:column;gap:14px;margin-top:36px}
.erow{display:flex;align-items:center;gap:20px;padding:26px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.erow .n{width:48px;height:48px;border-radius:24px;background:var(--pri-s);color:var(--pri);font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.erow .n.warn{background:var(--warn-s);color:var(--warn)}
.erow .t{font-size:24px;font-weight:800}
.erow .d{font-size:19px;color:#4e5968;margin-top:4px;line-height:1.5}
.erow .m{margin-left:auto;font-size:24px;font-weight:800;color:var(--pri);white-space:nowrap}
.hero-num{font-size:56px;font-weight:800;letter-spacing:-1px;color:var(--pri);margin:8px 0}

/* icons & map extras */
.ico{width:40px;height:40px;border-radius:12px;background:var(--pri-s);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ico svg{width:22px;height:22px}
.ico.sm{width:30px;height:30px;border-radius:9px}.ico.sm svg{width:17px;height:17px}
.ico.lg{width:56px;height:56px;border-radius:16px}.ico.lg svg{width:30px;height:30px}
.ico.warn{background:var(--warn-s);color:var(--warn)}
.ico.gray{background:var(--bg);color:var(--sub)}
.pin{width:30px;height:30px;border-radius:15px;color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.pin.a{background:#191f28}.pin.b{background:var(--pri)}
.legend{display:flex;gap:22px;align-items:center;font-size:14px;color:var(--sub);margin:14px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:6px}
.legend span{display:inline-flex;align-items:center;gap:4px}

.slots{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.slot{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:1.5px dashed #d5dae0}
.slot.now{border-color:var(--pri);background:var(--pri-s)}
.slot.full{border:1px solid var(--line)}
.slot .name{font-size:16px;font-weight:700}.slot .meta{font-size:13px;color:var(--sub);margin-top:2px}
.pin.empty{background:#fff;border:1.5px dashed #b8c0ca;color:var(--mute)}
.segs{display:inline-flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg{height:38px;padding:0 18px;border-radius:9px;font-size:15px;color:var(--sub);font-weight:600}
.seg.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(25,31,40,.1)}
textarea.paste{margin-top:16px;width:100%;height:150px;border:1px solid var(--line);border-radius:14px;padding:16px 18px;font:inherit;font-size:15px;line-height:1.7;resize:none;outline:0;color:var(--ink)}
textarea.paste:focus{border-color:var(--pri)}

.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fields label{font-size:13px;color:var(--sub);display:flex;flex-direction:column;gap:6px}
.inp{display:flex;align-items:center;gap:6px;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:15px;color:var(--sub)}
.inp input{flex:1;min-width:0;width:100%;border:0;outline:0;font:inherit;font-size:16px;font-weight:700;color:var(--ink)}
.inp input::placeholder{font-weight:400;font-size:13px;color:var(--mute)}
.compose .ico{margin-left:-8px}

.verdict{margin-top:36px;background:var(--pri-s);border-radius:20px;padding:26px 28px}
.vt{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:800;letter-spacing:-.4px;margin:8px 0 18px}
.vrows{display:flex;flex-direction:column;gap:2px;background:#fff;border-radius:14px;padding:6px 16px}
.vr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.vr:last-child{border-bottom:0}
.vk{width:130px;font-size:15px;font-weight:700}
.vv{flex:1;font-size:15px;color:var(--sub)}

.cal{border:1px solid var(--line);border-radius:16px;padding:18px 18px 10px}
.cal-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-h b{font-size:17px}
.cal-h .nav{width:30px;height:30px;border-radius:8px;background:var(--bg);font-size:16px;color:var(--sub)}
.cal-lg{margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--sub)}
.cal-lg span{display:inline-flex;align-items:center;gap:5px}
.cal-lg i{width:14px;height:8px;border-radius:3px;display:inline-block}
.cal-lg i.warn{background:var(--warn-s);border:1px solid #f0c08a}.cal-lg i.pri{background:var(--pri-s);border:1px solid #b9cbff}.cal-lg i.line{border:1.5px solid var(--pri);background:#fff}
.dow{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;color:var(--mute);text-align:left;padding:0 6px 6px}
.wk{border-top:1px solid var(--line);min-height:76px;padding-bottom:6px}
.days{display:grid;grid-template-columns:repeat(7,1fr)}
.dn{font-size:13px;color:var(--ink);padding:6px 6px 4px}
.dn.sun{color:#d64545}.dn.out{color:#cfd5dc}
.dn.today span{background:var(--pri);color:#fff;border-radius:11px;padding:2px 6px;font-weight:700}
.bars{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:24px;row-gap:3px;padding:0 2px}
.bar{font-size:12px;font-weight:700;text-align:left;padding:0 8px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 2px}
.bar.warn{background:var(--warn-s);color:var(--warn);border:1px solid #f0c08a}
.bar.pri{background:var(--pri-s);color:var(--pri);border:1px solid #b9cbff}
.bar.line,.bar.me{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
.bar.me{color:var(--ink);border-color:var(--ink)}
.bar.sel{box-shadow:0 0 0 2px currentColor}
.slots{grid-template-columns:repeat(3,1fr)!important}
.slot.add{border-color:#b9cbff;text-align:left}
.dot{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:6px}

/* ===== WEB LAYOUT ===== */
.wrap{width:1200px;margin:0 auto;display:flex;align-items:center}
.gnb{height:72px;border-bottom:1px solid var(--line);background:#fff;flex-shrink:0}
.gnb .wrap{height:100%;gap:48px}
.gnb .logo{font-size:21px}
.menu{display:flex;gap:30px;font-size:15px;color:var(--sub);font-weight:600}
.menu span.on{color:var(--ink)}
.gnb-r{margin-left:auto;display:flex;gap:18px;align-items:center}
.btn-sm{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line);font-size:14px;font-weight:600;background:#fff}
.stepbar{background:var(--bg);border-bottom:1px solid var(--line);flex-shrink:0}
.stepbar .wrap{height:80px}
.sb{flex:1;display:flex;align-items:center;gap:12px;color:var(--mute);text-align:left}
.sb:last-child{flex:0 0 auto}
.sb i{font-style:normal;width:30px;height:30px;border-radius:15px;background:#fff;border:1.5px solid #d5dae0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.sb .sl{display:flex;flex-direction:column;line-height:1.35}
.sb .sl b{font-size:15px;white-space:nowrap}
.sb .sl small{font-size:12px;white-space:nowrap}
.sb:not(:last-child)::after{content:"";flex:1;height:2px;background:#e1e5ea;margin:0 18px;min-width:30px}
.sb.on{color:var(--ink)}
.sb.on i{background:var(--pri);border-color:var(--pri);color:#fff}
.sb.done{color:var(--sub)}
.sb.done i{background:var(--pri-s);border-color:#b9cbff;color:var(--pri)}
.sb.done::after{background:#b9cbff}
.main{flex:1;display:block;padding:48px 0 88px}
.layout{width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:56px;align-items:start}
.col{width:auto;min-width:0}
.aside{position:sticky;top:24px;display:flex;flex-direction:column;gap:16px}
.panel{border:1px solid var(--line);border-radius:16px;padding:20px 22px;background:#fff}
.panel.soft{background:var(--bg);border-color:transparent}
.panel-t{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.panel-t .link{margin-left:auto;font-size:13px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:8px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--sub)}
.kv b{font-weight:700;text-align:right}
.kv .link{white-space:nowrap;flex-shrink:0}
.kv b.q{color:var(--warn);font-weight:600}
.big-amt{font-size:28px;font-weight:800;color:var(--pri);letter-spacing:-.5px;margin:2px 0}
.tray{display:flex;flex-direction:column;gap:6px;margin:4px 0 14px}
.tray div{font-size:14px;display:flex;align-items:center;gap:8px}
.tray .dot{width:8px;height:8px;border-radius:4px}
.btn.full{width:100%;height:46px;font-size:15px}
.cta{position:static;background:none;padding:0;margin-top:44px;display:flex;gap:10px;justify-content:flex-end}
.cta .btn.wide{flex:none;width:auto;min-width:260px}
h1{font-size:32px}
.chatpanel{border:1px solid var(--line);border-radius:20px;padding:26px 26px 20px;margin-top:28px;background:#fff}
.chatpanel .chat{margin-top:0}
.chatpanel .bub{max-width:76%}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.scard{border:1.5px solid var(--line);border-radius:16px;padding:20px;text-align:left;display:flex;flex-direction:column;gap:6px;background:#fff}
.scard:hover{border-color:#b9cbff}
.scard.on{border-color:var(--pri);background:var(--pri-s)}
.scard .top0{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.scard .top0 .radio{margin-left:auto}
.scard .name{font-size:17px;font-weight:800}
.scard .amt{font-size:24px;font-weight:800;letter-spacing:-.4px}
.scard.on .amt{color:var(--pri)}
.scard .meta{font-size:13px;color:var(--sub);line-height:1.5}
.ft{border-top:1px solid var(--line);background:var(--bg);flex-shrink:0}
.ft .wrap{height:84px;gap:16px;font-size:13px;color:var(--sub)}
.ft b{color:var(--ink);font-size:15px}
.ft .r{margin-left:auto}
/* easy mode on web: one centered column, no sidebar */
.easy .layout{grid-template-columns:1fr;width:880px}
.easy .aside{display:none}
.easy .cta{justify-content:stretch}
.easy .cta .btn.wide{flex:1;width:100%}
.easy .sb .sl b{font-size:17px}

.hrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.hrow:last-of-type{border-bottom:0}
.hrow .pin{width:26px;height:26px;font-size:12px;color:#fff}
.hn{font-size:15px;font-weight:700}
.hm{font-size:13px;color:var(--sub)}
.hrow .link{white-space:nowrap}
#kmap{width:100%;height:380px;border-radius:14px;background:#f2f4f6}
.kpin{padding:4px 10px;border-radius:14px;color:#fff;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.kpin.dest{background:#ff9919}
</style>
</head>
<body>
<div id="root"></div>
<script>
const ICONS={
 train:'<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 21l1.5-4M15 21l-1.5-4"/>',

function d0(m,d){ return new Date(2026,m,d); }
function calendar(){
  const m=S.calM, first=d0(m,1), start=new Date(first); start.setDate(1-first.getDay());
  const weeks=[]; let cur=new Date(start);
  while(true){ const w=[]; for(let i=0;i<7;i++){ w.push(new Date(cur)); cur.setDate(cur.getDate()+1); } weeks.push(w); if(cur.getMonth()!==m) break; }
  const evs=CAL_EVENTS.map(e=>({...e, sd:d0(...e.s), ed:d0(...e.e)}));
  const body=weeks.map(w=>{
    const ws=w[0], we=w[6]; const lanes=[];
    const bars=evs.filter(e=>e.sd<=we && e.ed>=ws).map(e=>{
      const a=Math.max(0,Math.round((e.sd-ws)/864e5)), b=Math.min(6,Math.round((e.ed-ws)/864e5));
      let lane=0; while(lanes[lane]&&lanes[lane].some(([x,y])=>!(b<x||a>y))) lane++; (lanes[lane]=lanes[lane]||[]).push([a,b]);
      const dd=Math.round((e.ed-TODAY)/864e5);
      const label = (b-a<2 && e.sd<ws) ? `${e.ed.getDate()}일 마감` : e.name;
      const c=PCOL[e.id]; const st = e.kind==='me' ? 'background:#fff;color:#191f28;border:1.5px solid #191f28' : e.kind==='line' ? `background:#fff;color:${c.fg};border:1.5px solid ${c.fg}` : `background:${c.bg};color:${c.fg};border:1px solid ${c.bd}`;
      return `<button class="bar ${S.open===e.id&&e.id?'sel':''}" style="${st};grid-column:${a+1}/${b+2};grid-row:${lane+1}" ${e.id?`onclick="set({open:'${e.id}'})" data-act="달력 막대 → 해당 정책 펼침"`:''}>${label}</button>`;
    }).join('');
    return `<div class="wk"><div class="days">${w.map(d=>{const out=d.getMonth()!==m, today=+d===+TODAY;return `<div class="dn ${out?'out':''} ${today?'today':''} ${d.getDay()===0?'sun':''}"><span>${d.getDate()}</span></div>`}).join('')}</div><div class="bars">${bars}</div></div>`;
  }).join('');
  return `<div class="cal">
    <div class="cal-h"><button class="nav" onclick="set({calM:10})" ${m===10?'style="opacity:.3"':''} data-act="이전 달">‹</button><b>2026년 ${m+1}월</b><button class="nav" onclick="set({calM:11})" ${m===11?'style="opacity:.3"':''} data-act="다음 달">›</button>

}

const val = (h, f) => (S.over[h.key] && S.over[h.key][f] !== undefined) ? S.over[h.key][f] : h[f];
const fareMonth = h => Math.round(h.fare * 2 * DAYS / 1000) / 10;            // 만 원
const monthly = h => Math.round((val(h,'rent') + val(h,'fee') + fareMonth(h)) * 10) / 10;
const clamp = v => Math.max(0, Math.min(100, v));
const walkScore = m => clamp(100 * (20 - m) / 15);
const r1 = v => Math.round(v * 10) / 10;
function scores(){
  const H = hs(), minC = Math.min(...H.map(monthly)), w = PRIO[S.prio].w;
  return H.map(h => {
    const cost = clamp(100 - (monthly(h) - minC) * 1.5);
    const time = clamp(100 - Math.max(0, h.commute - 15) * 2);
    const life = FAC.reduce((a, f) => a + walkScore(LIFE[h.key][f.k][1]), 0) / FAC.length;
    return {h, cost:r1(cost), time:r1(time), life:r1(life), total:r1(cost*w.cost + time*w.time + life*w.life)};
  }).sort((a, b) => b.total - a.total);
}
function reasons(rank){
  const out = [], top = rank[0].h, H = rank.map(r => r.h);
  const cheap = H.reduce((a, b) => monthly(a) <= monthly(b) ? a : b), fast = H.reduce((a, b) => a.commute <= b.commute ? a : b);
  const eun = s => s + ((s.charCodeAt(s.length-1) - 0xAC00) % 28 ? '은' : '는');
  const nm = h => h.label.replace(' 원룸', '').replace('동', '');
  if (top === cheap) out.push(`한 달 실부담이 <b>${monthly(top)}만 원</b>으로 ${H.length}곳 중 가장 적어요.${val(top,'deposit') === Math.min(...H.map(h => val(h,'deposit'))) ? ` 보증금도 ${val(top,'deposit').toLocaleString()}만 원으로 처음 드는 목돈이 가장 적어요.` : ''}`);
  if (top === fast) out.push(`${DEST.name}까지 <b>${top.route === '걸어서' ? '걸어서 ' : ''}${top.commute}분</b>으로 가장 가까워요.`);
  H.forEach(a => H.forEach(b => { if (a !== b && monthly(a) > monthly(b) && a.commute >= b.commute)
    out.push(`${eun(nm(a))} ${nm(b)}보다 한 달 <b>${r1(monthly(a) - monthly(b))}만 원</b> 더 들지만, 오가는 시간은 ${a.commute === b.commute ? '같아요' : '더 길어요'} (${a.commute}분 vs ${b.commute}분).`); }));
  if (fast !== cheap) { const hrs = r1((cheap.commute - fast.commute) * 2 * DAYS / 60), extra = r1(monthly(fast) - monthly(cheap));
    if (hrs > 0) out.push(`${eun(nm(fast))} ${nm(cheap)}보다 한 달 ${extra}만 원 더 내고, 오가는 시간을 한 달 약 <b>${hrs}시간</b> 아껴요. 1시간에 약 ${r1(extra / hrs)}만 원인 셈이에요.`); }
  return out;
}
function weakness(h){
  const far = FAC.filter(f => LIFE[h.key][f.k][1] >= 15).map(f => `${f.label}(${LIFE[h.key][f.k][0]})까지 걸어서 약 ${LIFE[h.key][f.k][1]}분`);
  return far.length ? far.join(', ') + '이라 조금 멀어요.' : '';
}

const KAKAO_JS_KEY = 'JS_KEY';

let _kvis = null, _kloading = null;
function mapBox(vis){ if(!kakaoOn()) return seoulMap(vis); _kvis = vis || null; return '<div id="kmap"></div>'; }
function loadKakao(){
  if(window.kakao && kakao.maps && kakao.maps.services) return Promise.resolve();
  if(_kloading) return _kloading;
  _kloading = new Promise((ok, fail) => {
    const sc = document.createElement('script');
    sc.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_JS_KEY}&libraries=services&autoload=false`;
    sc.onload = () => kakao.maps.load(ok);
    sc.onerror = () => fail();
    document.head.appendChild(sc);
  });
  return _kloading;
}
function geocode(addr){
  if(GEO[addr]) return Promise.resolve(GEO[addr]);
  return new Promise((ok, fail) => new kakao.maps.services.Geocoder().addressSearch(addr, (r, st) => {
    if(st === kakao.maps.services.Status.OK){ GEO[addr] = new kakao.maps.LatLng(r[0].y, r[0].x); ok(GEO[addr]); } else fail(addr);
  }));
}
async function drawKakao(){
  const el = document.getElementById('kmap'); if(!el) return;

    return `<div class="eyebrow">4단계</div><h1>정연님에게는<br><span style="color:var(--pri)">${t.key} 집</span>을 추천해요</h1>
      <div class="lead">돈, 오가는 시간, 동네 생활을 모두 따져 봤어요.</div>
      <div class="sec">${mapBox()}</div>
      <div class="sec" style="margin-top:12px">
        <div class="erow"><span class="ico lg">${svgIcon('receipt')}</span><div><div class="t">${t===cheap?'한 달에 드는 돈이 가장 적어요':`한 달에 ${monthly(t)}만 원이 들어요`}</div><div class="d">월세와 교통비를 합쳐 한 달 ${monthly(t)}만 원이에요.</div></div></div>
        <div class="erow"><span class="ico lg">${svgIcon('train')}</span><div><div class="t">${DEST.name}까지 ${t.commute}분이에요</div><div class="d">${t.route==='걸어서'?'걸어서 갈 수 있어요.':'지하철 '+t.route.split(' · ')[0]+' 한 번이면 가요.'}</div></div></div>
        ${wk?`<div class="erow"><span class="ico lg warn">${svgIcon('cart')}</span><div><div class="t">조금 먼 곳도 있어요</div><div class="d">${wk}</div></div></div>`:''}
      </div>
      <div class="cta"><button class="btn pri wide" onclick="set({easy:false})" data-act="일반 화면으로 자세히">자세히 비교하기</button></div>`;
  }
  if(S.detail){
    const h=HOMES.find(x=>x.key===S.detail.home)||H[0], sc=S.detail.scene||'sick';
    return `<button class="link back" onclick="set({detail:null})" data-act="뒤로">‹ 집 비교로 돌아가기</button>
      <div class="eyebrow" style="margin-top:20px">동네 생활 지도</div><h1>${h.key} · ${h.label} 주변</h1>
      <div class="lead">집과 장면을 고르면 지도에서 그 장소가 강조돼요. 카카오 장소 검색으로 찾은 가장 가까운 곳이에요.</div>
      <div class="chips" style="margin-top:22px">${H.map(x=>`<button class="chip ${x===h?'on':''}" onclick="set({detail:{home:'${x.key}',scene:'${sc}'}})" data-act="집 바꾸기">${x.key} ${x.label}</button>`).join('')}</div>
      <div class="chips" style="margin-top:10px">${Object.entries(SCENES).map(([k,x])=>`<button class="chip ${sc===k?'on':''}" onclick="set({detail:{home:'${h.key}',scene:'${k}'}})" data-act="장면 바꾸기 → 지도 강조 변경">${x.name}</button>`).join('')}</div>
      <div class="sec" style="margin-top:18px">${neighMap(h, sc)}</div>
      <div class="strip">${H.map(x=>`<div>${x.key} · ${SCENES[sc].name}<b class="${x===h?'pri':''}" style="font-size:18px">${SCENES[sc].f.map(f=>`${LIFE[x.key][f][0]} ${LIFE[x.key][f][1]}분`).join('<br>')}</b></div>`).join('')}</div>
      <div class="sec"><div class="sec-t">직접 가봐야 할 부분 <small>지도 데이터로는 알 수 없어요</small></div><p class="p">영업시간 · 주말·야간 진료 여부 · 역까지 경사와 계단 · 소음과 채광</p></div>`;
  }
  const th=H.map(h=>`<th><span class="dot" style="background:${h.color}"></span>${h.key} · ${h.label}</th>`).join('');
  const minOf=f=>Math.min(...H.map(h=>LIFE[h.key][f][1]));
  const minM=Math.min(...H.map(monthly)), minT=Math.min(...H.map(h=>h.commute));
  const lifeSc=Object.fromEntries(rank.map(r=>[r.h.key,r.life])), maxL=Math.max(...rank.map(r=>r.life));
  const rs=reasons(rank), wk=weakness(top.h);
  return `<div class="eyebrow">4단계 · 집 비교</div><h1>어느 집이 나한테 맞을까?</h1>
    <div class="lead">생활 편의, 한 달 비용, 오가는 시간을 한 번에 따져서 추천해요. 숫자는 모두 실제 주소로 계산했어요.</div>
    <div class="sec"><div class="sec-t">나한테 제일 중요한 건? <small>고르면 종합 추천이 바로 다시 계산돼요</small></div>${prioChips()}</div>
    <div class="sec">${mapBox()}</div>

    <div class="sec"><div class="sec-t"><span class="ico sm">${svgIcon('train')}</span>생활 편의 <small>가장 가까운 곳까지 걸어서 · 행을 누르면 동네 지도</small></div>
      <table><tr><th style="width:22%">시설</th>${th}</tr>
      ${FAC.map(f=>`<tr class="clk" onclick="set({detail:{home:'${top.h.key}',scene:'${Object.keys(SCENES).find(k=>SCENES[k].f.includes(f.k))}'}})" data-act="행 클릭 → 동네 생활 지도"><td><div style="display:flex;align-items:center;gap:10px;font-weight:700"><span class="ico sm">${svgIcon(f.icon)}</span>${f.label}</div></td>${H.map(h=>{const v=LIFE[h.key][f.k];return `<td class="${v[1]===minOf(f.k)?'best':''}">${v[0]} ${v[1]}분${v[1]>=15?' <span class="pill warn">멀어요</span>':''}</td>`}).join('')}</tr>`).join('')}
      <tr><td style="font-weight:700">생활 점수</td>${H.map(h=>`<td class="${lifeSc[h.key]===maxL?'best':''}" style="font-weight:800">${lifeSc[h.key]}</td>`).join('')}</tr></table></div>

    <div class="sec"><div class="sec-t"><span class="ico sm">${svgIcon('receipt')}</span>비용 · 오가는 시간 <small>월세 + 관리비 + 교통비 = 한 달 실부담</small></div>
      <table><tr><th style="width:22%"></th>${th}</tr>
        <tr><td class="s">보증금</td>${H.map(h=>`<td>${val(h,'deposit').toLocaleString()}만 원</td>`).join('')}</tr>
        <tr><td class="s">월세</td>${H.map(h=>`<td>${val(h,'rent')}만 원</td>`).join('')}</tr>
        <tr><td class="s">관리비</td>${H.map(h=>`<td>${val(h,'fee')?val(h,'fee')+'만 원':'<span class="s">입력 안 함</span>'}</td>`).join('')}</tr>
        <tr><td class="s">교통비 (한 달)</td>${H.map(h=>`<td>${fareMonth(h)?fareMonth(h)+'만 원':'0원 (걸어서)'}</td>`).join('')}</tr>
        <tr><td style="font-weight:700">한 달 실부담</td>${H.map(h=>`<td class="${monthly(h)===minM?'best':''}" style="font-weight:800">${monthly(h)}만 원</td>`).join('')}</tr>
        <tr><td style="font-weight:700">${DEST.name}까지</td>${H.map(h=>`<td class="${h.commute===minT?'best':''}" style="font-weight:700">${h.commute}분 · ${h.route.split(' · ')[0]}</td>`).join('')}</tr>
      </table>
      <p class="s" style="margin-top:10px">교통비 = ODsay 편도 요금 × 2 × ${DAYS}일 · 관리비를 넣으면 실부담에 더해져요.</p></div>

    <div class="verdict" id="verdict">
      <div class="s" style="color:var(--pri);font-weight:700">종합 추천 · ${PRIO[S.prio].name} (비용 ${w.cost*100}% · 시간 ${w.time*100}% · 생활 ${w.life*100}%)</div>
      <div class="vt"><span class="pin" style="width:36px;height:36px;border-radius:18px;font-size:16px;background:${top.h.color}">${top.h.key}</span>${top.h.label}을 추천해요 <span class="pill" style="margin-left:6px">${top.total}점</span></div>
      <div style="margin:14px 0 4px">${prioChips()}</div>
      <div class="vrows" style="margin-top:14px">
        ${rank.map((r,i)=>`<div class="vr"><span class="pin" style="background:${r.h.color};width:26px;height:26px;font-size:12px">${r.h.key}</span><div class="vk">${i+1}위 · ${r.h.label}</div><div class="vv">비용 ${r.cost} · 시간 ${r.time} · 생활 ${r.life}</div><span class="pill ${i?'gray':''}">종합 ${r.total}</span></div>`).join('')}
      </div>
      <div class="note" style="margin-top:18px;background:#fff;display:block"><div style="font-weight:700;margin-bottom:6px">이렇게 추천했어요</div>${rs.map(t=>`<div style="margin-top:4px">• ${t}</div>`).join('')}</div>
      ${wk?`<div class="note warn" style="margin-top:10px"><span class="ic">!</span><div>아쉬운 점 · ${top.h.label}은 ${wk}</div></div>`:''}
      <details style="margin-top:14px"><summary class="s" style="cursor:pointer">점수는 이렇게 계산해요</summary><p class="s" style="margin-top:8px;line-height:1.8">비용: 가장 싼 집 100점, 월 10만 원 비쌀 때마다 −15점<br>시간: 15분 이하 100점, 그 뒤 1분마다 −2점<br>생활: 시설마다 걸어서 5분 이하 100점, 20분 이상 0점 → 8개 평균<br>점수와 숫자는 코드가 계산하고, AI는 이 근거로만 설명해요.</p></details>
    </div>
    <div class="hr"></div>
    <div class="diff" style="margin-top:0"><div><h4 style="color:var(--pri)">데이터로 확인한 것</h4><p class="s">주변 시설 거리 (카카오 로컬) · 오가는 시간·요금 (ODsay)</p></div><div><h4 style="color:var(--warn)">직접 확인해야 할 것</h4><p class="s">관리비 · 건물 용도 · 소음 · 채광 · 수압과 곰팡이</p></div></div>`;
}

function render(){
  const body=[null,step1,step2,step3,step4][S.step]();
  document.getElementById('root').innerHTML=`<div class="app ${S.easy?'easy':''}">${header()}<div class="main"><div class="layout"><div class="col">${body}</div><aside class="aside">${aside()}</aside></div></div>${footer()}</div>`;
  if(document.getElementById('kmap')) drawKakao();
}
render();
</script>
</body>
</html>
